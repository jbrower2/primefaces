<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="primefaces"
	template="/WEB-INF/template.xhtml"
>

	<ui:define name="title">Tag</ui:define>

	<ui:define name="description">
		Tag component is used to categorize content.
	</ui:define>

	<ui:param name="documentationLink" value="/components/tag" />

	<ui:define name="implementation">
		<div class="card">
			<h5>Tags</h5>
			<p:tag styleClass="mr-2" value="Primary" />
			<p:tag styleClass="mr-2" severity="success" value="Success" />
			<p:tag styleClass="mr-2" severity="info" value="Info" />
			<p:tag styleClass="mr-2" severity="warning" value="Warning" />
			<p:tag severity="danger" value="Danger" />

			<h5>Pills</h5>
			<p:tag styleClass="mr-2" value="Primary" rounded="true" />
			<p:tag
				styleClass="mr-2"
				severity="success"
				value="Success"
				rounded="true"
			/>
			<p:tag styleClass="mr-2" severity="info" value="Info" rounded="true" />
			<p:tag
				styleClass="mr-2"
				severity="warning"
				value="Warning"
				rounded="true"
			/>
			<p:tag severity="danger" value="Danger" rounded="true" />

			<h5>Icons</h5>
			<p:tag styleClass="mr-2" icon="pi pi-user" value="Primary" />
			<p:tag
				styleClass="mr-2"
				icon="pi pi-check"
				severity="success"
				value="Success"
			/>
			<p:tag
				styleClass="mr-2"
				icon="pi pi-info-circle"
				severity="info"
				value="Info"
			/>
			<p:tag
				styleClass="mr-2"
				icon="pi pi-exclamation-triangle"
				severity="warning"
				value="Warning"
			/>
			<p:tag icon="pi pi-times" severity="danger" value="Danger" />
		</div>
	</ui:define>

</ui:composition>
